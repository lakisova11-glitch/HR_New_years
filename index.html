<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С Новым годом!</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: 'Georgia', serif;
    color: #fff;
    overflow: hidden;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 50px;
    backdrop-filter: blur(6px);
    max-width: 500px;
    animation: fadeIn 1s ease-in-out;
  }
  h1 { font-size: 2em; margin-bottom: 10px; }
  p { font-size: 1.2em; line-height: 1.5; }
  input {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    font-size: 1em;
    margin-top: 20px;
    width: 70%;
    text-align: center;
    font-family: 'Georgia', serif;
  }
  button {
    margin-top: 15px;
    padding: 12px 30px;
    border-radius: 10px;
    border: none;
    background: #fff;
    color: #203a43;
    font-size: 1em;
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: 0.3s;
  }
  button:hover {
    background: #e0e0e0;
  }
  .hidden { display: none; }
  @keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
  }
  .snow {
    position: fixed;
    top: -10px;
    color: white;
    font-size: 1.5em;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(110vh); }
  }
</style>
</head>
<body>

  <div class="card" id="formCard">
    <h1>Привет! 👋</h1>
    <p>Как тебя зовут?</p>
    <input type="text" id="nameInput" placeholder="Введи своё имя">
    <br>
    <button onclick="showGreeting()">Узнать поздравление</button>
  </div>

  <div class="card hidden" id="greetingCard">
    <h1 id="greeting"></h1>
    <p>Пусть этот год принесёт тебе вдохновение, поддержку близких и побольше поводов для искренней радости. Мы рады, что ты с нами 🥂✨</p>
  </div>

<script>
  function showGreeting() {
    const name = document.getElementById('nameInput').value.trim();
    const greetingText = name ? `С Новым годом, ${name}!` : 'С Новым годом!';

    document.getElementById('greeting').innerText = greetingText;
    document.getElementById('formCard').classList.add('hidden');
    document.getElementById('greetingCard').classList.remove('hidden');
  }

  // Снег появляется сразу, независимо от этапа
  for (let i = 0; i < 40; i++) {
    const flake = document.createElement('div');
    flake.className = 'snow';
    flake.innerText = '❄';
    flake.style.left = Math.random() * 100 + 'vw';
    flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
    flake.style.opacity = Math.random();
    document.body.appendChild(flake);
  }
</script>
</body>
</html>
